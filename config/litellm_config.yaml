model_list:
  # Local model group (proxied to llama-server)
  - model_name: local
    litellm_params:
      model: openai/local-general
      api_base: http://llama-server:8080/v1

  # Local code model group (same llama-server router, different model ID)
  - model_name: local_code
    litellm_params:
      model: openai/local-code
      api_base: http://llama-server:8080/v1

  # Cheap remote model group
  # Requires OPENAI_API_KEY in the environment.
  - model_name: cheap
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Frontier remote model group
  # Requires OPENAI_API_KEY in the environment.
  - model_name: frontier
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 1
  request_timeout: 120

general_settings:
  master_key: sk-litellm
