# CUDA override — layer this on top of docker-compose.yml for GPU support:
#   docker compose -f docker-compose.yml -f docker-compose.cuda.yml up
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      --models-dir /models
      --models-preset /config/llama_models.ini
      --models-max ${LLAMA_MODELS_MAX:-2}
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
      --n-gpu-layers ${N_GPU_LAYERS:-99}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
