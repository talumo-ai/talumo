services:
  # ---------- local inference ----------
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - ${LLAMA_MODEL_HOST_DIR:-./models}:/models
      - ./config/llama_models.ini:/config/llama_models.ini:ro
    command: >
      --models-dir /models
      --models-preset /config/llama_models.ini
      --models-max ${LLAMA_MODELS_MAX:-2}
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
      --n-gpu-layers 0
    # Configure model location via .env (LLAMA_MODEL_HOST_DIR).
    # Configure model IDs and files in config/llama_models.ini.
    # For GPU support: docker compose -f docker-compose.yml -f docker-compose.cuda.yml up

  # ---------- LiteLLM gateway ----------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - llama-server

  # ---------- Orchestrator ----------
  orchestrator:
    build: .
    ports:
      - "8000:8000"
    environment:
      # All tiers route through LiteLLM; local tier is LiteLLM model alias "local".
      - TALUMO_LITELLM_BASE_URL=http://litellm:4000/v1
      - TALUMO_LITELLM_API_KEY=sk-litellm
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - litellm
